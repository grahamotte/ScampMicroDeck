default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
development:
  <<: *default
  database: <%= Settings.all.fetch(:database) %>_development
test:
  <<: *default
  database: <%= Settings.all.fetch(:database) %>_test
production:
  <<: *default
  database: <%= Settings.all.fetch(:database) %>_production
  username: deploy
  password:
