[tools]
node = "26.7.0"
pnpm = "11.21.0"
ruby = "4.0.6"
python = "3.14.7"
deno = "2.9.5"

[env]
_.file = '.env.development'
LANG = "{{ get_env(name='LANG', default='en_US.UTF-8') }}"
GH_REPO = "{{ env.GITHUB_REPO | trim_start_matches(pat='git@github.com:') | trim_end_matches(pat='.git') }}"

#
# Dependencies
#

[tasks."dependencies:backend"]
run = "cd backend && mkdir -p log && bundle install"

[tasks."dependencies:frontend"]
run = "cd frontend && mkdir -p log && pnpm install"

[tasks."dependencies:deploy"]
run = "cd deploy && mkdir -p log && bundle install"

[tasks."dependencies:manager"]
run = "cd manager && mkdir -p log && bundle install"

[tasks."dependencies:gems"]
run = '''
printf "%s\0" gems/*/ | xargs -0 -n 1 -P 4 sh -c '
  cd "$1"
  bundle install
' sh
'''

[tasks."dependencies:python"]
run = [
  "pip install --upgrade pip",
  "pip install requests PyYAML numpy pandas pydantic",
]

[tasks.dependencies]
depends = ["dependencies:*"]

#
# Update
#

[tasks."update:backend"]
run = "cd backend && bundle update"

[tasks."update:frontend"]
run = "cd frontend && pnpm update --latest --config.minimum-release-age=10080"

[tasks."update:gems"]
run = "for dir in gems/*/; do (cd \"$dir\" && bundle update); done"

[tasks.update]
depends = ["update:*"]

#
# Reset
#

[tasks."reset:logs"]
run = "find */log -type f -mtime +7 -exec rm -v {} \\;"

[tasks."reset:db"]
depends = ["dependencies:backend"]
run = [
  "cd backend && rm -rf db/schema.rb",
  "cd backend && rails db:drop",
  "cd backend && rails db:create",
  "cd backend && rails db:migrate",
  "cd backend && rails runner script/reset.rb",
]

[tasks."reset:frontend"]
run = [
  "cd frontend && rm -rf build || true",
  "cd frontend && rm -rf dist || true",
  "cd frontend && rm -rf node_modules || true",
  "cd frontend && rm -rf .vite || true",
  "cd frontend && rm -rf .react-router || true",
  "cd frontend && pnpm install",
]

[tasks.reset]
depends = ["reset:*"]

#
# DB
#

[tasks."db:add:migration"]
depends = ["dependencies:backend"]
run = 'cd backend && rails g migration {{arg(name="name")}}'

[tasks."db:reset"]
depends = ["reset:db"]

[tasks."db:migrate"]
alias = ["migrate"]
depends = ["dependencies:backend"]
run = "cd backend && rails db:migrate"

[tasks."db:rollback"]
alias = ["rollback"]
depends = ["dependencies:backend"]
run = "cd backend && rails db:rollback"

#
# Start
#

[tasks."start:backend"]
depends = ["dependencies:backend", "migrate", "start:details"]
run = "cd backend && bin/rails server --port 3000"

[tasks."start:jobs"]
depends = ["dependencies:backend", "migrate", "start:details"]
env = { GOOD_JOB_ENABLE_CRON = "true" }
run = "cd backend && bundle exec good_job start"

[tasks."start:portless"]
depends = ["dependencies:frontend"]
dir = "frontend"
interactive = true
run = "pnpm exec portless proxy start --https"

[tasks."start:subdomains"]
depends = ["dependencies:frontend", "start:details"]
run = '''
node -e '
  const fs = require("fs");
  const base = process.env.LOCAL_DOMAIN || process.env.DOMAIN.split(".")[0];
  for (const subdomain of JSON.parse(fs.readFileSync("frontend/subdomains.json")).filter(({ backend }) => backend)) {
    const prefix = subdomain.subdomains.includes("") ? "" : `${subdomain.subdomains[0]}.`;
    console.log(`${prefix}${base}`, 3000);
  }
' | xargs -n 2 sh -c 'pnpm --dir frontend exec portless alias "$1" "$2"' sh
node -e '
  const fs = require("fs");
  const base = process.env.LOCAL_DOMAIN || process.env.DOMAIN.split(".")[0];
  for (const subdomain of JSON.parse(fs.readFileSync("frontend/subdomains.json")).filter(({ directory }) => directory)) {
    const prefix = subdomain.subdomains.includes("") ? "" : `${subdomain.subdomains[0]}.`;
    console.log(subdomain.name, `${prefix}${base}`);
  }
' | xargs -n 2 -P 0 sh -c 'VITE_SUBDOMAIN="$1" pnpm --dir frontend exec portless "$2" pnpm exec vite' sh
'''

[tasks."start:details"]
depends = ["start:portless"]
run = '''
node <<'NODE'
const fs = require("fs");
const subdomains = JSON.parse(fs.readFileSync("frontend/subdomains.json"));
const base = process.env.LOCAL_DOMAIN || process.env.DOMAIN.split(".")[0];
const rows = subdomains.map((subdomain) => {
  const prefix = subdomain.subdomains.includes("") ? "" : `${subdomain.subdomains[0]}.`;
  const label = subdomain.name.toUpperCase();
  return [label, `https://${prefix}${base}.localhost`];
});
rows.push(["API", "http://localhost:3000"]);
const labelWidth = Math.max(...rows.map(([label]) => label.length));
const lines = [`${process.env.DOMAIN} · Development`, ...rows.map(([label, url]) => `${label.padEnd(labelWidth)}  ${url}`)];
const width = Math.max(...lines.map((line) => line.length));
console.log(`\n╔${"═".repeat(width + 2)}╗`);
for (const line of lines) console.log(`║ ${line.padEnd(width)} ║`);
console.log(`╚${"═".repeat(width + 2)}╝\n`);
NODE
'''

[tasks.start]
depends = [
  "start:backend",
  "start:jobs",
  "start:subdomains",
]

#
# Debug
#

[tasks.console]
depends = ["dependencies:backend"]
run = "cd backend && rails console"

[tasks."console:production"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby fix.rb"

[tasks.runner]
depends = ["dependencies:backend"]
env = { RAILS_LOG_LEVEL = "info" }
run = 'cd backend && rails runner {{arg(name="code")}}'

[tasks."runner:production"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby runner.rb"

[tasks.query]
depends = ["dependencies:backend"]
run = 'cd backend && rails runner script/query.rb {{arg(name="query")}}'

[tasks."query:production"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby query.rb"

#
# Test
#

[tasks."test:backend"]
depends = ["dependencies:backend"]
run = "cd backend && rails test"

[tasks."test:deploy"]
depends = ["dependencies:deploy"]
run = 'cd deploy && bundle exec ruby -Itests -e "Dir.glob(\"tests/**/*_test.rb\").each { |f| require_relative f }"'

[tasks."test:manager"]
depends = ["dependencies:manager"]
run = 'cd manager && bundle exec ruby -Itests -e "Dir.glob(\"tests/**/*_test.rb\").each { |f| require_relative f }"'

[tasks."test:apps"]
run = 'cd apps/apple && cp Tests/Package.swift Package.swift && trap "rm Package.swift" EXIT && swift test --quiet --scratch-path ../../deploy/tmp/apps/swift-tests'

[tasks.tsc]
depends = ["dependencies:frontend"]
run = "cd frontend && pnpm exec tsc"

[tasks."test:frontend"]
depends = ["tsc"]
run = "cd frontend && pnpm test"

[tasks."test:gems"]
depends = ["dependencies:gems"]
run = '''
printf "%s\0" gems/*/ | xargs -0 -n 1 -P 4 sh -c '
  cd "$1"
  bundle exec ruby -Itest -e "Dir.glob(\"test/**/*_test.rb\").each { |f| require_relative f }"
' sh
'''

[tasks."test"]
depends = ["test:*"]

#
# Deploy
#

[tasks."deploy:spawn"]
alias = ["spawn"]
usage = 'arg "<domain>" help="Website domain (e.g., example.com)"'
run = 'cd deploy && ruby spawn.rb "$usage_domain"'

[tasks."deploy"]
depends = ["dependencies:deploy"]
run = "set -o pipefail && set -a && source .env.production && cd deploy && ruby deploy.rb 2>&1 | tee log/$(date +%Y-%m-%d-%H-%M-%S)_deploy.log"

[tasks."deploy:quick"]
alias = ["quick"]
depends = ["dependencies:deploy"]
run = "set -o pipefail && set -a && source .env.production && cd deploy && ruby quick.rb 2>&1 | tee log/$(date +%Y-%m-%d-%H-%M-%S)_quick.log"

[tasks."deploy:push"]
alias = ["push"]
depends = ["dependencies:deploy"]
run = "set -o pipefail && set -a && source .env.production && cd deploy && ruby push.rb 2>&1 | tee log/$(date +%Y-%m-%d-%H-%M-%S)_push.log"

[tasks."deploy:publish"]
alias = ["publish"]
depends = ["deploy:push"]
usage = '''
flag "--stop-before-submission" help="Prepare App Store versions for review without submitting"
flag "--stop-before-prepare" help="Upload App Store builds for TestFlight without preparing or submitting versions"
'''
run = """
set -o pipefail
set -a
source .env.production
export PUBLISH_STOP_BEFORE_SUBMISSION="${usage_stop_before_submission:-false}"
export PUBLISH_STOP_BEFORE_PREPARE="${usage_stop_before_prepare:-false}"
cd deploy
ruby publish.rb 2>&1 | tee log/$(date +%Y-%m-%d-%H-%M-%S)_publish.log
"""

[tasks."deploy:approved-version"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby approved_version.rb"

[tasks."deploy:patch"]
depends = ["dependencies:deploy"]
usage = 'arg "<name>" help="Patch to apply (e.g., nginx)"'
run = 'set -o pipefail && set -a && source .env.production && cd deploy && ruby patch.rb "$usage_name" 2>&1 | tee log/$(date +%Y-%m-%d-%H-%M-%S)_patch.log'

[tasks."deploy:destroy"]
depends = ["dependencies:deploy"]
run = "set -o pipefail && set -a && source .env.production && cd deploy && ruby destroy.rb 2>&1 | tee log/$(date +%Y-%m-%d-%H-%M-%S)_destroy.log"

[tasks."deploy:log"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby log.rb"

[tasks."deploy:ssh"]
alias = ["ssh"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby ssh.rb"

[tasks."deploy:cmd"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby cmd.rb"

[tasks."deploy:htop"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby htop.rb"

[tasks."deploy:backup"]
depends = ["dependencies:deploy"]
run = "set -o pipefail && set -a && source .env.production && cd deploy && ruby backup.rb 2>&1 | tee log/$(date +%Y-%m-%d-%H-%M-%S)_backup.log"

[tasks."deploy:restore"]
depends = ["dependencies:deploy"]
run = "set -o pipefail && set -a && source .env.production && cd deploy && ruby restore.rb 2>&1 | tee log/$(date +%Y-%m-%d-%H-%M-%S)_restore.log"

[tasks."deploy:pry"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby pry.rb"

[tasks."deploy:reboot"]
depends = ["dependencies:deploy"]
run = "set -o pipefail && set -a && source .env.production && cd deploy && ruby reboot.rb 2>&1 | tee log/$(date +%Y-%m-%d-%H-%M-%S)_reboot.log"

[tasks."deploy:status"]
alias = ["status"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby status.rb"

[tasks."deploy:set-version"]
depends = ["dependencies:deploy"]
usage = 'arg "<version>" help="Semantic version (e.g., 1.1.1)"'
run = 'cd deploy && ruby set_version.rb "$usage_version"'

#
# Other
#

[tasks.merge]
run = [
  "if [ -n \"$(git status --porcelain)\" ]; then echo 'Error: You have uncommitted changes. Please commit or stash them before merging.'; exit 1; fi",
  "echo \"Merge recovery point: $(git rev-parse HEAD)\"",
  "if git remote get-url upstream >/dev/null 2>&1; then git remote set-url upstream git@github.com:grahamotte/codemoto.org.git; else git remote add upstream git@github.com:grahamotte/codemoto.org.git; fi",
  "git config remote.upstream.tagOpt --no-tags",
  "git config remote.origin.gh-resolved base",
  "git fetch --no-tags upstream master",
  '''git ls-remote --tags upstream | grep -v "\^{}$" | while read -r sha ref; do tag="${ref#refs/tags/}"; if [ "$(git rev-parse -q --verify "refs/tags/$tag")" = "$sha" ]; then git tag -d "$tag"; fi; done''',
  "if ! git merge-base HEAD upstream/master >/dev/null; then echo 'Error: This repository does not share history with Code Moto.'; exit 1; fi",
  "git merge --no-edit --no-ff upstream/master",
]

[tasks.simulate]
depends = ["dependencies:deploy"]
usage = 'arg "<target>" help="Device to launch" choices "iphone" "phone" "ipad" "tablet" "mac" "macos" "osx" "tv" "tvos"'
run = 'cd deploy && ruby simulate.rb "$usage_target"'

[tasks.xcode]
run = "open apps/apple/App.xcodeproj"

#
# Manager
#

[tasks."manager:trigger"]
depends = ["dependencies:manager"]
run = "cd manager && bundle exec ruby trigger.rb"

[tasks."manager:triggerall"]
depends = ["dependencies:manager"]
run = "cd manager && bundle exec ruby trigger_all.rb"

[tasks."manager:sync"]
depends = ["dependencies:manager"]
run = "cd manager && bundle exec ruby sync.rb"

[tasks."manager:syncall"]
depends = ["dependencies:manager"]
run = "cd manager && bundle exec ruby sync_all.rb"

[tasks."manager:watch"]
depends = ["dependencies:manager"]
run = "cd manager && bundle exec ruby watch.rb"

[tasks."manager:gotomain"]
depends = ["dependencies:manager"]
run = "cd manager && bundle exec ruby goto_main.rb"

[tasks."manager:gotomainall"]
depends = ["dependencies:manager"]
run = "cd manager && bundle exec ruby goto_main_all.rb"

#
# Linear
#

[tasks."linear:create"]
depends = ["dependencies:manager"]
usage = """
arg "<title>" help="Card title"
arg "<body>" help="Markdown description"
flag "--column <column>" help="Column name" default="backlog" choices "backlog" "planned" "ready" "working" "review" "approved" "completed" "canceled"
"""
run = 'cd manager && bundle exec ruby card.rb create "$usage_title" "$usage_body" "$usage_column"'

[tasks."linear:show"]
depends = ["dependencies:manager"]
usage = 'arg "<card>" help="Card identifier, e.g. MOTO-1"'
run = 'cd manager && bundle exec ruby card.rb show "$usage_card"'

[tasks."linear:move"]
depends = ["dependencies:manager"]
usage = """
arg "<card>" help="Card identifier, e.g. MOTO-1"
arg "<column>" help="Column name" choices "backlog" "planned" "ready" "working" "review" "approved" "completed" "canceled"
"""
run = 'cd manager && bundle exec ruby card.rb move "$usage_card" "$usage_column"'

[tasks."linear:comment"]
depends = ["dependencies:manager"]
usage = """
arg "<card>" help="Card identifier, e.g. MOTO-1"
arg "<body>" help="Markdown comment body"
"""
run = 'cd manager && bundle exec ruby card.rb comment "$usage_card" "$usage_body"'

[tasks."linear:link"]
depends = ["dependencies:manager"]
usage = """
arg "<card>" help="Card identifier, e.g. MOTO-1"
arg "<url>" help="URL to link"
arg "[title]" help="Link title"
"""
run = 'cd manager && bundle exec ruby card.rb link "$usage_card" "$usage_url" "${usage_title:-}"'

[tasks."linear:tag"]
depends = ["dependencies:manager"]
usage = """
arg "<card>" help="Card identifier, e.g. MOTO-1"
arg "<tag>" help="Tag name"
"""
run = 'cd manager && bundle exec ruby card.rb tag "$usage_card" "$usage_tag"'

[tasks."linear:untag"]
depends = ["dependencies:manager"]
usage = """
arg "<card>" help="Card identifier, e.g. MOTO-1"
arg "<tag>" help="Tag name"
"""
run = 'cd manager && bundle exec ruby card.rb untag "$usage_card" "$usage_tag"'
