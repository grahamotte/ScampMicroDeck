[tools]
node = "26.7.0"
pnpm = "11.21.0"
ruby = "4.0.6"
python = "3.14.7"
deno = "2.9.5"
"npm:linearis" = "2026.8.0"

[env]
_.file = '.env.development'
LANG = "{{ get_env(name='LANG', default='en_US.UTF-8') }}"
GH_REPO = "{{ read_file(path='config.json') | split(pat='\"githubRepo\": \"') | last | split(pat='\"') | first | trim_start_matches(pat='git@github.com:') | trim_end_matches(pat='.git') }}"

[task_config]
shell = "bash -o errexit -o pipefail -c"

#
# Dependencies
#

[tasks."dependencies:backend"]
run = "cd backend && mkdir -p log && bundle install"

[tasks."dependencies:frontend"]
run = "cd frontend && mkdir -p log && pnpm install"

[tasks."dependencies:deploy"]
run = "cd deploy && mkdir -p log && bundle install"

[tasks."dependencies:manager"]
run = "cd manager && mkdir -p log && bundle install"

[tasks."dependencies:publish"]
run = "cd publish && mkdir -p log && bundle install"

[tasks."dependencies:gems"]
run = "scripts/mise/dependencies_gems.sh"

[tasks."dependencies:python"]
run = [
  "pip install --upgrade pip",
  "pip install requests PyYAML numpy pandas pydantic",
]

[tasks.dependencies]
depends = ["dependencies:*"]

#
# Reset
#

[tasks."reset:logs"]
run = "find */log -type f -mtime +7 -exec rm -v {} \\;"

[tasks."reset:db"]
depends = ["dependencies:backend"]
run = [
  "cd backend && rm -rf db/schema.rb",
  "cd backend && rails db:drop",
  "cd backend && rails db:create",
  "cd backend && rails db:migrate",
  "cd backend && rails runner script/reset.rb",
]

[tasks."reset:frontend"]
run = [
  "cd frontend && rm -rf build || true",
  "cd frontend && rm -rf dist || true",
  "cd frontend && rm -rf node_modules || true",
  "cd frontend && rm -rf .vite || true",
  "cd frontend && rm -rf .react-router || true",
  "cd frontend && pnpm install",
]

[tasks.reset]
depends = ["reset:*"]

#
# DB
#

[tasks."db:add:migration"]
depends = ["dependencies:backend"]
run = 'cd backend && rails g migration {{arg(name="name")}}'

[tasks."db:reset"]
depends = ["reset:db"]

[tasks."db:migrate"]
alias = ["migrate"]
depends = ["dependencies:backend"]
run = "cd backend && rails db:migrate"

[tasks."db:rollback"]
alias = ["rollback"]
depends = ["dependencies:backend"]
run = "cd backend && rails db:rollback"

#
# Start
#

[tasks."start:backend"]
depends = ["dependencies:backend", "migrate", "start:details"]
run = "cd backend && bin/rails server --port 3000"

[tasks."start:jobs"]
depends = ["dependencies:backend", "migrate", "start:details"]
env = { GOOD_JOB_ENABLE_CRON = "true" }
run = "cd backend && bundle exec good_job start"

[tasks."start:portless"]
depends = ["dependencies:frontend"]
dir = "frontend"
interactive = true
run = "pnpm exec portless proxy start --https"

[tasks."start:subdomains"]
depends = ["dependencies:frontend", "start:details"]
run = "scripts/mise/start_subdomains.sh"

[tasks."start:details"]
depends = ["start:portless"]
run = "scripts/mise/start_details.js"

[tasks.start]
depends = [
  "start:backend",
  "start:jobs",
  "start:subdomains",
]

#
# Debug
#

[tasks.console]
depends = ["dependencies:backend"]
run = "cd backend && rails console"

[tasks."console:production"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby fix.rb"

[tasks.runner]
depends = ["dependencies:backend"]
env = { RAILS_LOG_LEVEL = "info" }
run = 'cd backend && rails runner {{arg(name="code")}}'

[tasks."runner:production"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby runner.rb"

[tasks.query]
depends = ["dependencies:backend"]
run = 'cd backend && rails runner script/query.rb {{arg(name="query")}}'

[tasks."query:production"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby query.rb"

#
# Test
#

[tasks."test:backend"]
depends = ["dependencies:backend"]
run = "cd backend && rails test"

[tasks."test:deploy"]
depends = ["dependencies:deploy"]
run = 'cd deploy && bundle exec ruby -Itests -e "Dir.glob(\"tests/**/*_test.rb\").each { |f| require_relative f }"'

[tasks."test:manager"]
depends = ["dependencies:manager"]
run = 'cd manager && bundle exec ruby -Itests -e "Dir.glob(\"tests/**/*_test.rb\").each { |f| require_relative f }"'

[tasks."test:publish"]
depends = ["dependencies:publish"]
run = 'cd publish && bundle exec ruby -Itests -e "Dir.glob(\"tests/**/*_test.rb\").each { |f| require_relative f }"'

[tasks."test:apps"]
run = 'cd apps/apple && cp Tests/Package.swift Package.swift && trap "rm Package.swift" EXIT && swift test --quiet --scratch-path ../../publish/tmp/apps/swift-tests'

[tasks.tsc]
depends = ["dependencies:frontend"]
run = "cd frontend && pnpm exec tsc"

[tasks."test:frontend"]
depends = ["tsc"]
run = "cd frontend && pnpm test"

[tasks."test:gems"]
depends = ["dependencies:gems"]
run = "scripts/mise/test_gems.sh"

[tasks."test"]
depends = ["test:*"]

#
# Deploy
#

[tasks."deploy"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby deploy.rb 2>&1 | tee log/$(date +%Y-%m-%d-%H-%M-%S)_deploy.log"

[tasks."deploy:quick"]
alias = ["quick"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby quick.rb 2>&1 | tee log/$(date +%Y-%m-%d-%H-%M-%S)_quick.log"

[tasks."deploy:patch"]
depends = ["dependencies:deploy"]
usage = 'arg "<name>" help="Patch to apply (e.g., nginx)"'
run = 'set -a && source .env.production && cd deploy && ruby patch.rb "$usage_name" 2>&1 | tee log/$(date +%Y-%m-%d-%H-%M-%S)_patch.log'

[tasks."deploy:destroy"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby destroy.rb 2>&1 | tee log/$(date +%Y-%m-%d-%H-%M-%S)_destroy.log"

[tasks."deploy:log"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby log.rb"

[tasks."deploy:ssh"]
alias = ["ssh"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby ssh.rb"

[tasks."deploy:cmd"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby cmd.rb"

[tasks."deploy:htop"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby htop.rb"

[tasks."deploy:backup"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby backup.rb 2>&1 | tee log/$(date +%Y-%m-%d-%H-%M-%S)_backup.log"

[tasks."deploy:restore"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby restore.rb 2>&1 | tee log/$(date +%Y-%m-%d-%H-%M-%S)_restore.log"

[tasks."deploy:pry"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby pry.rb"

[tasks."deploy:reboot"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby reboot.rb 2>&1 | tee log/$(date +%Y-%m-%d-%H-%M-%S)_reboot.log"

[tasks."deploy:status"]
alias = ["status"]
depends = ["dependencies:deploy"]
run = "set -a && source .env.production && cd deploy && ruby status.rb"

#
# Publish
#

[tasks.publish]
depends = ["dependencies:publish"]
usage = 'arg "[mode]" help="Where to stop publishing" choices "stop_before_prepare" "stop_before_submit"'
run = 'set -a && source .env.production && cd publish && ruby publish.rb ${usage_mode:-} 2>&1 | tee log/$(date +%Y-%m-%d-%H-%M-%S)_publish.log'

[tasks."publish:stop_before_prepare"]
depends = ["publish stop_before_prepare"]

[tasks."publish:stop_before_submit"]
depends = ["publish stop_before_submit"]

[tasks."publish:approved_version"]
depends = ["dependencies:publish"]
run = "set -a && source .env.production && cd publish && ruby approved_version.rb"

[tasks."publish:set_version"]
depends = ["dependencies:publish"]
usage = 'arg "<version>" help="Semantic version (e.g., 1.1.1)"'
run = 'cd publish && ruby set_version.rb "$usage_version"'

[tasks."publish:simulate"]
alias = ["simulate"]
depends = ["dependencies:publish"]
usage = 'arg "<target>" help="Device to launch" choices "iphone" "phone" "ipad" "tablet" "mac" "macos" "osx" "tv" "tvos"'
run = 'cd publish && ruby simulate.rb "$usage_target"'

[tasks."publish:xcode"]
alias = ["xcode"]
run = "open apps/apple/App.xcodeproj"

#
# Manager
#

[tasks."manager:trigger"]
depends = ["dependencies:manager"]
run = "cd manager && bundle exec ruby trigger.rb"

[tasks."manager:triggerall"]
depends = ["dependencies:manager"]
run = "cd manager && bundle exec ruby trigger_all.rb"

[tasks."manager:linear_sync"]
depends = ["dependencies:manager"]
run = "cd manager && bundle exec ruby linear_sync.rb"

[tasks."manager:linear_syncall"]
depends = ["dependencies:manager"]
run = "cd manager && bundle exec ruby linear_sync_all.rb"

[tasks."manager:secrets"]
run = "scripts/mise/manager_secrets.sh"

[tasks."manager:spawn"]
alias = ["spawn"]
depends = ["dependencies:manager"]
usage = 'arg "<domain>" help="Website domain (e.g., example.com)"'
run = 'cd manager && bundle exec ruby spawn.rb "$usage_domain"'

[tasks."manager:merge"]
alias = ["merge"]
usage = 'arg "[branch]" help="Branch to merge into, created from origin/master" default="codemoto-merge"'
run = "scripts/mise/manager_merge.sh"

#
# Linear
#

[tasks.linear]
raw_args = true
run = 'LINEAR_API_TOKEN="$LINEAR_TOKEN" linearis'
